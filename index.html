<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PG Examination Portal, Sabang Sajanikanta Mahavidyalaya</title>

    <meta name="description"
          content="PG Examination Portal of Sabang Sajanikanta Mahavidyalaya">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 620px;
            background: white;
            padding: 45px 35px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,.12);
        }

        h1 {
            margin-bottom: 8px;
            color: #123b73;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 26px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>PG Examination Portal</h1>

    <p>
        Sabang Sajanikanta Mahavidyalaya<br>
        Office of the Controller of Examinations
    </p>

    <p>
        Please click below to access the examination portal.
    </p>

    <a class="button"
       href="https://script.google.com/">
        Open Examination Portal
    </a>

</div>

</body>
</html>
