<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PG Examination Portal - Launcher</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background-color: #eef2f7; 
      text-align: center; 
      margin: 0; 
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card { 
      background: #ffffff; 
      max-width: 420px; 
      width: 100%;
      padding: 40px 30px; 
      border-radius: 12px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
      border-top: 5px solid #0d6efd; 
      box-sizing: border-box;
    }
    .college-name { 
      font-size: 13px; 
      font-weight: 700; 
      color: #6c757d; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      margin-bottom: 5px; 
    }
    .portal-name { 
      color: #0d6efd; 
      font-size: 24px; 
      font-weight: 800; 
      margin: 0 0 20px 0; 
      letter-spacing: -0.5px;
    }
    .divider {
      height: 1px;
      background: #e2e5e9;
      margin: 0 auto 20px auto;
      width: 50%;
    }
    p { 
      color: #4a5568; 
      font-size: 15px; 
      line-height: 1.6; 
      margin-bottom: 30px; 
    }
    .btn { 
      display: block; 
      background: #0d6efd; 
      color: #ffffff; 
      padding: 15px 24px; 
      text-decoration: none; 
      border-radius: 8px; 
      font-weight: 700; 
      font-size: 16px; 
      width: 100%; 
      box-sizing: border-box; 
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
    }
    .btn:hover {
      background: #0b5ed7;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .fallback { 
      display: inline-block; 
      margin-top: 25px; 
      font-size: 13px; 
      color: #6c757d; 
      text-decoration: none; 
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .fallback:hover {
      color: #495057;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="college-name">Sabang Sajanikanta Mahavidyalaya</div>
    <h1 class="portal-name">PG Examination Portal</h1>
    
    <div class="divider"></div>
    
    <p>Please click below to continue with Native Browser.</p>
    
    <a id="launch-btn" href="https://sskm-web.github.io/pg-examination-portal" target="_blank" class="btn">
      Open in Secure Browser
    </a>

    <a href="https://sites.google.com/sabangcollege.ac.in/coe" class="fallback">Continue here to College CoE Portal</a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var btn = document.getElementById("launch-btn");
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;
      
      // If Android, inject the Chrome intent scheme to force-break the WebView
      if (/android/i.test(userAgent)) {
        btn.href = "intent://sskm-web.github.io/pg-examination-portal#Intent;scheme=https;package=com.android.chrome;end";
      }
    });
  </script>

</body>
</html>
